name: Starlark types

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sty:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: tamird/sty@3e47bd794feabe1ce777221c23a7217573b1ac3f
        with:
          audit-loads: true
          # Other production sources are checked through their registered interfaces.
          # Test Starlark is exercised by the Bazel CI matrix.
          files: |
            features.bzl
            private/extensions.bzl
            private/globals.bzl
